  <circle cx="400" cy="480" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="484" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">VERIFIED</text>
