  <text x="400" y="225" font-family="'JetBrains Mono', monospace" font-size="14" letter-spacing="4" fill="#a1a1aa" text-anchor="middle" font-weight="600">CERTIFICATE OF COMPLETION</text>
  <text x="400" y="270" font-family="'Inter', sans-serif" font-size="16" fill="#71717a" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>
  
  <!-- Recipient -->
