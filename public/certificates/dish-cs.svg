      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="512" fill="none" stroke="url(#border-grad)" stroke-width="2" rx="12"/>
  <rect x="36" y="36" width="728" height="488" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="6,4" rx="8"/>
  
  <!-- Seal / Emblem -->
  <circle cx="400" cy="130" r="48" fill="#18181b" stroke="#38bdf8" stroke-width="2.5"/>
  <polygon points="400,102 408,122 430,122 412,135 419,156 400,143 381,156 388,135 370,122 392,122" fill="#38bdf8"/>
  
